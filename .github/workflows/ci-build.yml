name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug repo contents
        run: |
          echo "Listing repository root contents for debugging"
          dir

      - name: Install dependencies
        run: npm install

      - name: Run server seed (creates initial user)
        env:
          SEED_USER: ${{ secrets.SEED_USER }}
          SEED_PASS: ${{ secrets.SEED_PASS }}
          SEED_ROLE: ${{ secrets.SEED_ROLE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Running seed script..."
          npm --workspace server run seed

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestao-escolar-frontend
          path: frontend/dist

      # Optional: build electron installer in CI runners with proper tooling
      # - name: Build Electron (installer)
      #   run: npm --workspace electron run package

      # - name: Upload electron artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: gestao-escolar-electron
      #     path: electron/dist


  # Separate job that runs the seed on Ubuntu with debug output. This helps when native builds differ across runners.
  seed-ubuntu:
    name: Seed (Ubuntu)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug repo root
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- server dir ---"
          ls -la server || true

      - name: Install server dependencies
        working-directory: server
        run: |
          echo "Installing server dependencies in ./server"
          npm install

      - name: Run server seed (Ubuntu)
        working-directory: server
        env:
          SEED_USER: ${{ secrets.SEED_USER }}
          SEED_PASS: ${{ secrets.SEED_PASS }}
          SEED_ROLE: ${{ secrets.SEED_ROLE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Running seed script (node scripts/seed.js)..."
          node scripts/seed.js || npm run seed

      - name: Show server data.db and users
        run: |
          echo "data.db files in server:"
          ls -la server || true
          echo "If data.db exists, show its size and list users via sqlite3 (if available)"
          if command -v sqlite3 >/dev/null 2>&1; then
            sqlite3 server/data.db "select id,username,role,name from users;" || true
          else
            echo "sqlite3 not available on runner"
          fi

